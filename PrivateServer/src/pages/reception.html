<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table4U — Recepção</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/shared.css">

    <script>
        (function () {
            var t = localStorage.getItem('t4u-private-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        #content { flex: 1; overflow-y: auto; }
        .content-inner { padding: 24px 24px 40px; }
        .section-view { display: none; }
        .section-view.active { display: block; }

        .mesas-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .mesas-header-left { display: flex; flex-direction: column; gap: 2px; }
        .section-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .section-sub { font-size: 0.78rem; color: var(--text-muted); }
        .mesas-header-right { display: flex; align-items: center; gap: 12px; }
        .table-count-badge { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-muted); background: var(--accent-subtle); padding: 3px 10px; border-radius: 20px; }

        .status-legend { display: flex; gap: 18px; margin-bottom: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 7px; font-size: 0.78rem; color: var(--text-secondary); }
        .legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

        .stats-bar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .stat-chip { display: flex; align-items: center; gap: 8px; background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 10px; padding: 8px 14px; box-shadow: var(--shadow-card); }
        .stat-chip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
        .stat-chip-label { font-size: 0.75rem; color: var(--text-secondary); }
        .stat-chip-val { font-family: 'IBM Plex Mono', monospace; font-size: 0.85rem; font-weight: 500; color: var(--text-primary); }

        .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }

        .table-card { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 14px; padding: 18px 16px 16px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; box-shadow: var(--shadow-card); position: relative; overflow: hidden; display: flex; flex-direction: column; gap: 10px; }
        .table-card:hover { transform: translateY(-2px); box-shadow: 0 6px 24px rgba(0,0,0,0.1); }
        .table-card:active { transform: translateY(0); }
        .table-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 14px 0 0 14px; }
        .table-card.available  { border-color: var(--status-available-border); }
        .table-card.available::before  { background: var(--status-available); }
        .table-card.occupied   { border-color: var(--status-occupied-border); }
        .table-card.occupied::before   { background: var(--status-occupied); }
        .table-card.unavailable { border-color: var(--status-unavailable-border); }
        .table-card.unavailable::before { background: var(--status-unavailable); }
        .card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .card-mesa-num { font-family: 'IBM Plex Mono', monospace; font-size: 1.05rem; font-weight: 500; color: var(--text-primary); }
        .card-badge { font-size: 0.64rem; font-weight: 700; padding: 3px 8px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; flex-shrink: 0; }
        .available  .card-badge { background: var(--status-available-bg);   color: var(--status-available);   border: 1px solid var(--status-available-border); }
        .occupied   .card-badge { background: var(--status-occupied-bg);    color: var(--status-occupied);    border: 1px solid var(--status-occupied-border); }
        .unavailable .card-badge { background: var(--status-unavailable-bg); color: var(--status-unavailable); border: 1px solid var(--status-unavailable-border); }
        .card-icon { width: 42px; height: 42px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; }
        .available   .card-icon { background: var(--status-available-bg); }
        .occupied    .card-icon { background: var(--status-occupied-bg); }
        .unavailable .card-icon { background: var(--status-unavailable-bg); }
        .card-meta { font-size: 0.75rem; color: var(--text-muted); line-height: 1.45; }
        .card-meta strong { color: var(--text-secondary); font-weight: 500; }
        .capacity-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: 2px; }
        .cap-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
        .cap-dot.filled.available   { background: var(--status-available); }
        .cap-dot.filled.occupied    { background: var(--status-occupied); }
        .cap-dot.filled.unavailable { background: var(--status-unavailable); }

        #modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 100; align-items: center; justify-content: center; }
        #modal-overlay.open { display: flex; }
        #modal { background: var(--bg-card); border-radius: 18px; width: 100%; max-width: 420px; box-shadow: var(--shadow-modal); animation: modal-in 0.22s cubic-bezier(0.16,1,0.3,1) both; max-height: 90vh; overflow-y: auto; }
        @keyframes modal-in { from { opacity:0; transform:scale(0.95) translateY(8px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-header { padding: 20px 24px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .modal-table-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
        .modal-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .modal-subtitle { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
        .modal-close { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 6px; display: flex; align-items: center; transition: color 0.15s, background 0.15s; }
        .modal-close:hover { color: var(--text-primary); background: var(--accent-subtle); }
        .modal-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
        .modal-body { padding: 20px 24px 24px; }
        .checkin-label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 10px; display: block; }
        .guest-counter { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .counter-btn { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; flex-shrink: 0; }
        .counter-btn:hover { border-color: var(--border-focus); background: var(--accent-subtle); }
        .counter-value { font-size: 1.4rem; font-weight: 600; color: var(--text-primary); min-width: 32px; text-align: center; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn { width: 100%; padding: 12px 18px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s, transform 0.1s; }
        .modal-btn:active { transform: scale(0.98); }
        .modal-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .btn-primary-action   { background: var(--accent); color: #fff; }
        .btn-primary-action:hover { background: var(--accent-hover); }
        .btn-secondary-action { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--border); }
        .btn-secondary-action:hover { background: var(--border); color: var(--text-primary); }
        .btn-danger-action    { background: var(--status-unavailable-bg); color: var(--status-unavailable); border: 1px solid var(--status-unavailable-border); }
        .btn-danger-action:hover { background: rgba(220,38,38,0.14); }
        .btn-warning-action   { background: var(--status-occupied-bg); color: var(--status-occupied); border: 1px solid var(--status-occupied-border); }
        .btn-warning-action:hover { background: rgba(37,99,235,0.14); }
        .modal-divider { height: 1px; background: var(--border); margin: 14px 0; }
        .occupied-guests { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--status-occupied-bg); border: 1px solid var(--status-occupied-border); border-radius: 10px; margin-bottom: 16px; font-size: 0.83rem; color: var(--status-occupied); }
        .occupied-guests svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .occupied-guests strong { font-weight: 600; }

        /* ── PLACEHOLDER ── */
        .placeholder-page { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 480px; text-align: center; padding: 48px 24px; }
        .placeholder-icon { width: 64px; height: 64px; border-radius: 18px; background: var(--accent-subtle); display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .placeholder-icon svg { width: 28px; height: 28px; fill: none; stroke: var(--accent); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .placeholder-title { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        .placeholder-desc { font-size: 0.875rem; color: var(--text-secondary); max-width: 380px; line-height: 1.6; margin-bottom: 20px; }
        .placeholder-badge { display: inline-flex; align-items: center; gap: 6px; background: var(--status-warning-bg); color: var(--status-warning); border: 1px solid var(--status-warning-border); border-radius: 20px; font-size: 0.72rem; font-weight: 600; padding: 5px 12px; }
        .placeholder-badge svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }

        /* ── SIDEBAR UTILS ── */
        .oculto { visibility: hidden; }
        
        @media (max-width: 800px) {
            #sidebar { display: none; }
            .content-inner { padding: 16px 12px 32px; }
        }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="Navegação lateral">
    <div class="sidebar-header">
        <button class="sidebar-toggle" id="sidebar-toggle-btn" aria-label="Recolher/expandir menu">

                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>

            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>

</nav>

            <div class="topbar-page-icon" id="topbar-icon">

                            <span style="background: var(--accent); color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem;" id="fila-count-dash">0</span>
                        </div>
                        <div id="fila-container" style="display: flex; flex-direction: column; gap: 10px;">

                    </div>
                    <div style="background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px; box-shadow: var(--shadow-card);">

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const user = T4U.getUser();
        if (user.role === 'admin') {
            document.getElementById('btn-voltar-admin').classList.remove('oculto');
        }

</script>

<script>
    const topbarTitles = { mesas: 'Mesas', fila: 'Fila/Reservas' };
    const topbarIcons  = {
        mesas: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>`,
        fila:  `<svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>`
    };

    function showSection(id, el) {
        document.querySelectorAll('.section-view').forEach(v => v.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.getElementById('section-' + id).classList.add('active');
        if (el) el.classList.add('active');
        document.getElementById('topbar-title').textContent = topbarTitles[id] || id;
        document.getElementById('topbar-icon').innerHTML    = topbarIcons[id]  || '';
        if (id === 'fila') loadFilaReservas();
    }

    async function chamarFila(id) {
        try { await fetch('/api/chamar-fila/' + id, { method: 'POST' }); loadFilaReservas(); showToast('Cliente chamado!'); }
        catch (err) { console.error(err); }
    }

    async function atenderFila(id) {
        try { await fetch('/api/atender-fila/' + id, { method: 'POST' }); loadFilaReservas(); showToast('Cliente atendido!'); }
        catch (err) { console.error(err); }
    }

    async function loadFilaReservas() {
        try {
            const [fRes, rRes] = await Promise.all([fetch('/api/todas-filas'), fetch('/api/todas-reservas')]);
            const filas = await fRes.json(), reservas = await rRes.json();

            document.getElementById('fila-count-dash').textContent = filas.length;
            const filaContainer = document.getElementById('fila-container');
            if (!filas.length) {
                filaContainer.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">Nenhum cliente na fila</div>';
            } else {
                filaContainer.innerHTML = filas.map(f => {
                    const isSuaVez = f.status === 'sua vez chegou';
                    const actionBtn = isSuaVez
                        ? `<button onclick="atenderFila(${f.id_fila})" style="background:var(--status-available);color:white;border:none;padding:4px 10px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.75rem;">Atender</button>`
                        : `<button onclick="chamarFila(${f.id_fila})" style="background:var(--accent);color:white;border:none;padding:4px 10px;border-radius:6px;font-weight:600;cursor:pointer;font-size:0.75rem;">Chamar</button>`;
                    const sc  = isSuaVez ? 'var(--status-available)'        : 'var(--status-warning)';
                    const sb  = isSuaVez ? 'var(--status-available-bg)'     : 'var(--status-warning-bg)';
                    const sbr = isSuaVez ? 'var(--status-available-border)' : 'var(--status-warning-border)';
                    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--border);">
                        <div>
                            <div style="font-weight:600;color:var(--text-primary);font-size:0.85rem;">${f.Cliente ? f.Cliente.nome : 'Desconhecido'}</div>
                            <div style="font-size:0.75rem;color:var(--text-muted);">${new Date(f.data_entrada).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})} · ${f.numero_pessoas} pessoas</div>
                        </div>
                        <div style="display:flex;gap:8px;align-items:center;">
                            <span style="font-size:0.7rem;padding:3px 8px;border-radius:12px;background:${sb};color:${sc};border:1px solid ${sbr};text-transform:capitalize;">${f.status}</span>
                            ${actionBtn}
                        </div>
                    </div>`;
                }).join('');
            }

            document.getElementById('reservas-count-dash').textContent = reservas.length;
            const reservasContainer = document.getElementById('reservas-container');
            if (!reservas.length) {
                reservasContainer.innerHTML = '<div style="color:var(--text-muted);text-align:center;padding:20px;">Sem reservas</div>';
            } else {
                reservasContainer.innerHTML = reservas.map(r => `
                    <div style="display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border);">
                        <div>
                            <div style="font-weight:600;color:var(--text-primary);font-size:0.95rem;margin-bottom:4px;">${r.Cliente ? r.Cliente.nome : 'Desconhecido'}</div>
                            <div style="font-size:1.15rem;font-weight:bold;color:var(--accent);margin-bottom:4px;">${new Date(r.data_reserva).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>
                            <div style="font-size:0.8rem;color:var(--text-muted);">${r.numero_pessoas} pessoas</div>
                        </div>
                        <span style="font-size:0.7rem;padding:3px 8px;border-radius:12px;background:var(--status-warning-bg);color:var(--status-warning);border:1px solid var(--status-warning-border);">${r.status}</span>
                    </div>`).join('');
            }
        } catch (err) { console.error(err); }
    }

    setInterval(loadFilaReservas, 30000);
</script>

</body>
</html>
