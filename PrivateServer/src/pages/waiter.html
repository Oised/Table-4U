<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table4U — Garçom</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/shared.css">

    <!-- Tema aplicado antes do paint para evitar flash -->
    <script>
        (function () {
            var t = localStorage.getItem('t4u-private-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        /* ── CONTENT ── */
        #content { flex: 1; overflow-y: auto; padding: 24px 20px; }
        .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
        .section-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .table-count { font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; color: var(--text-muted); background: var(--accent-subtle); padding: 3px 8px; border-radius: 20px; }
        .status-legend { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .legend-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; color: var(--text-secondary); }
        .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
        .tables-grid { display: flex; flex-direction: column; gap: 12px; }

        /* ── TABLE CARD ── */
        .table-card { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 14px; padding: 20px 24px; display: flex; align-items: center; gap: 20px; cursor: pointer; transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s; box-shadow: var(--shadow-card); position: relative; overflow: hidden; }
        .table-card:hover { transform: translateY(-2px); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .table-card:active { transform: translateY(0); }
        .table-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 14px 0 0 14px; }
        .table-card.available { border-color: var(--status-available-border); }
        .table-card.available::before { background: var(--status-available); }
        .table-card.occupied { border-color: var(--status-occupied-border); }
        .table-card.occupied::before { background: var(--status-occupied); }
        .table-card.unavailable { border-color: var(--status-unavailable-border); }
        .table-card.unavailable::before { background: var(--status-unavailable); }
        .table-status-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; flex-shrink: 0; }
        .available .table-status-icon { background: var(--status-available-bg); }
        .occupied .table-status-icon { background: var(--status-occupied-bg); }
        .unavailable .table-status-icon { background: var(--status-unavailable-bg); }
        .table-info { flex: 1; min-width: 0; }
        .table-number { font-size: 1.05rem; font-weight: 600; color: var(--text-primary); margin-bottom: 3px; }
        .table-meta { font-size: 0.8rem; color: var(--text-secondary); }
        .table-badge { font-size: 0.72rem; font-weight: 600; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; letter-spacing: 0.05em; flex-shrink: 0; }
        .available .table-badge { background: var(--status-available-bg); color: var(--status-available); border: 1px solid var(--status-available-border); }
        .occupied .table-badge { background: var(--status-occupied-bg); color: var(--status-occupied); border: 1px solid var(--status-occupied-border); }
        .unavailable .table-badge { background: var(--status-unavailable-bg); color: var(--status-unavailable); border: 1px solid var(--status-unavailable-border); }
        .table-chevron { color: var(--text-muted); flex-shrink: 0; }
        .table-chevron svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        /* ── MODAL (sheet) ── */
        #modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 100; align-items: flex-end; justify-content: center; }
        #modal-overlay.open { display: flex; }
        #modal { background: var(--bg-card); border-radius: 20px 20px 0 0; width: 100%; max-width: 540px; box-shadow: var(--shadow-modal); animation: sheet-up 0.3s cubic-bezier(0.16,1,0.3,1) both; max-height: 90vh; overflow-y: auto; }
        @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
        .modal-header { padding: 16px 24px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px; }
        .modal-table-icon { width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.3rem; flex-shrink: 0; }
        .modal-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); }
        .modal-subtitle { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
        .modal-close { margin-left: auto; background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 6px; display: flex; align-items: center; transition: color 0.15s, background 0.15s; }
        .modal-close:hover { color: var(--text-primary); background: var(--accent-subtle); }
        .modal-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
        .modal-body { padding: 16px 24px 24px; }
        .checkin-label { font-size: 0.8rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 8px; display: block; }
        .guest-counter { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
        .counter-btn { width: 38px; height: 38px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-size: 1.2rem; font-weight: 300; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; flex-shrink: 0; }
        .counter-btn:hover { border-color: var(--border-focus); background: var(--accent-subtle); }
        .counter-value { font-size: 1.4rem; font-weight: 600; color: var(--text-primary); min-width: 32px; text-align: center; }
        .modal-actions { display: flex; flex-direction: column; gap: 10px; }
        .modal-btn { width: 100%; padding: 13px 18px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 10px; transition: background 0.15s, transform 0.1s; text-decoration: none; }
        .modal-btn:active { transform: scale(0.98); }
        .modal-btn svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .btn-primary-action { background: var(--accent); color: #fff; }
        .btn-primary-action:hover { background: var(--accent-hover); }
        .btn-secondary-action { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--border); }
        .btn-secondary-action:hover { background: var(--border); color: var(--text-primary); }
        .btn-danger-action { background: rgba(220,38,38,0.08); color: #dc2626; border: 1px solid rgba(220,38,38,0.2); }
        .btn-danger-action:hover { background: rgba(220,38,38,0.14); }
        .btn-warning-action { background: rgba(37,99,235,0.08); color: #2563eb; border: 1px solid rgba(37,99,235,0.2); }
        .btn-warning-action:hover { background: rgba(37,99,235,0.14); }

        /* ── ORDERS INSIDE MODAL ── */
        .orders-section { margin-bottom: 14px; }
        .orders-toggle-btn { display: flex; align-items: center; gap: 8px; font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); background: none; border: none; cursor: pointer; padding: 0 0 8px; text-transform: uppercase; letter-spacing: 0.06em; }
        .orders-toggle-btn svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
        .orders-toggle-btn.open svg { transform: rotate(180deg); }
        .orders-list { display: none; flex-direction: column; gap: 4px; padding: 10px; background: var(--bg-input); border-radius: 10px; border: 1px solid var(--border); max-height: 160px; overflow-y: auto; margin-bottom: 4px; }
        .orders-list.visible { display: flex; }
        .order-group { padding-bottom: 6px; margin-bottom: 6px; border-bottom: 1px dashed var(--border); }
        .order-group:last-child { border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
        .order-group-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 4px; font-weight: 600; }
        .order-item { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; padding: 3px 0; }
        .order-item-name { color: var(--text-primary); font-weight: 500; }
        .order-item-qty { color: var(--text-muted); font-size: 0.72rem; font-family: 'IBM Plex Mono', monospace; }
        .orders-empty { font-size: 0.8rem; color: var(--text-muted); text-align: center; padding: 8px 0; }

        @media (max-width: 600px) { #sidebar { display: none; } #content { padding: 16px 12px; } .table-card { padding: 16px; } }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="Navegação lateral">
    <div class="sidebar-header">
        <button class="sidebar-toggle" id="sidebar-toggle-btn" aria-label="Recolher/expandir menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            <span class="sidebar-brand">Table4U</span>
        </button>
    </div>
    <div class="sidebar-nav">
        <div class="nav-section-label">Garçom</div>
        <button class="nav-item active" data-tooltip="Mesas" id="nav-mesas">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span class="nav-label">Mesas</span>
        </button>
        <button class="nav-item" data-tooltip="Pedido" onclick="showToast('Selecione uma mesa!')">
            <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
            <span class="nav-label">Pedido</span>
        </button>
        <button class="nav-item" data-tooltip="Fechar Conta" onclick="showToast('Selecione uma mesa!')">
            <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            <span class="nav-label">Fechar Conta</span>
        </button>
    </div>
    <div class="sidebar-footer">
        <button class="nav-item logout" onclick="logout()" data-tooltip="Sair">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="nav-label">Sair</span>
        </button>
    </div>
</nav>

<div id="main">
    <header id="topbar">
        <div class="topbar-page-info">
            <div class="topbar-page-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            </div>
            <span class="topbar-page-name">Garçom</span>
            <div class="topbar-separator" aria-hidden="true"></div>
            <span class="topbar-page-title">Mesas</span>
        </div>
        <div class="topbar-controls">
            <button id="toggle-theme-btn" aria-label="Alternar tema">
                <div class="toggle-knob"><span id="toggle-icon">☀️</span></div>
            </button>
            <button id="profile-btn" aria-label="Menu do perfil">
                <span id="profile-initials">G</span>
            </button>
        </div>
    </header>

    <div id="profile-dropdown" role="menu">
        <div class="dropdown-header">
            <div class="dropdown-avatar" id="dropdown-avatar">G</div>
            <div>
                <div class="dropdown-name" id="dropdown-name">Garçom</div>
                <div class="dropdown-role" id="dropdown-role">garcom@rest.com</div>
            </div>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair
        </button>
    </div>

    <main id="content">
        <div class="section-header">
            <h1 class="section-title">Mesas do salão</h1>
            <span class="table-count" id="table-count">— mesas</span>
        </div>
        <div class="status-legend" aria-label="Legenda de status">
            <div class="legend-item"><div class="legend-dot" style="background:var(--status-available)"></div><span>Disponível</span></div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--status-occupied)"></div><span>Ocupada</span></div>
            <div class="legend-item"><div class="legend-dot" style="background:var(--status-unavailable)"></div><span>Indisponível</span></div>
        </div>
        <div class="tables-grid" id="tables-grid"></div>
    </main>
</div>

<div id="modal-overlay" role="dialog" aria-modal="true">
    <div id="modal">
        <div class="modal-handle" aria-hidden="true"></div>
        <div class="modal-header">
            <div class="modal-table-icon" id="modal-icon"></div>
            <div>
                <div class="modal-title" id="modal-title"></div>
                <div class="modal-subtitle" id="modal-subtitle"></div>
            </div>
            <button class="modal-close" onclick="closeModal()" aria-label="Fechar">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
    </div>
</div>

<div id="toast-container" aria-live="polite"></div>

<script src="../scripts/shared.js" defer></script>

<script>     
    // ── TABLES STATE ──
    const tables = [
        { id: 1, capacity: 4, status: 'available',   guests: 0 },
        { id: 2, capacity: 6, status: 'occupied',    guests: 4 },
        { id: 3, capacity: 2, status: 'unavailable', guests: 0 },
        { id: 4, capacity: 4, status: 'available',   guests: 0 },
        { id: 5, capacity: 8, status: 'occupied',    guests: 6 },
        { id: 6, capacity: 4, status: 'available',   guests: 0 },
        { id: 7, capacity: 2, status: 'unavailable', guests: 0 },
        { id: 8, capacity: 6, status: 'available',   guests: 0 },
    ];

    const STATUS_CONFIG = {
        available:   { icon: '🟢', label: 'Disponível',   meta: 'Pronta para receber clientes' },
        occupied:    { icon: '🔵', label: 'Ocupada',      meta: null },
        unavailable: { icon: '🔴', label: 'Indisponível', meta: 'Requer atenção antes de liberar' },
    };

    let activeTableId = null;

    function getOrders(tableId) {
        try { return JSON.parse(sessionStorage.getItem(`t4u-orders-table-${tableId}`)) || []; }
        catch { return []; }
    }

    function fmtTime(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }

    // Seed demo orders
    function seedDemoOrders() {
        if (!sessionStorage.getItem('t4u-orders-table-2')) {
            const demo2 = [{ timestamp: Date.now() - 3600000, items: [{ name: 'Risoto de camarão', price: 78, qty: 2 }, { name: 'Suco natural', price: 16, qty: 4 }], total: 220 }];
            sessionStorage.setItem('t4u-orders-table-2', JSON.stringify(demo2));
        }
        if (!sessionStorage.getItem('t4u-orders-table-5')) {
            const demo5 = [
                { timestamp: Date.now() - 5400000, items: [{ name: 'Frango grelhado', price: 52, qty: 3 }, { name: 'Água mineral', price: 7, qty: 6 }], total: 198 },
                { timestamp: Date.now() - 1800000, items: [{ name: 'Tiramisù', price: 28, qty: 2 }, { name: 'Espresso', price: 10, qty: 2 }], total: 76 }
            ];
            sessionStorage.setItem('t4u-orders-table-5', JSON.stringify(demo5));
        }
    }

    function renderTables() {
        const grid = document.getElementById('tables-grid');
        grid.innerHTML = '';
        document.getElementById('table-count').textContent = `${tables.length} mesas`;
        tables.forEach(table => {
            const cfg = STATUS_CONFIG[table.status];
            const orders = getOrders(table.id);
            const totalRounds = orders.length;
            const totalItems = orders.reduce((s, r) => s + r.items.reduce((ss, i) => ss + i.qty, 0), 0);
            let meta = '';
            if (table.status === 'occupied') {
                meta = `${table.guests} pessoas`;
                if (totalRounds > 0) meta += ` · ${totalRounds} rodada${totalRounds > 1 ? 's' : ''} · ${totalItems} itens`;
            } else {
                meta = cfg.meta || `Capacidade: ${table.capacity} pessoas`;
            }
            const card = document.createElement('div');
            card.className = `table-card ${table.status}`;
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            card.innerHTML = `
                <div class="table-status-icon">${cfg.icon}</div>
                <div class="table-info">
                    <div class="table-number">Mesa ${table.id}</div>
                    <div class="table-meta">${meta}</div>
                </div>
                <span class="table-badge">${cfg.label}</span>
                <div class="table-chevron"><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></div>
            `;
            card.addEventListener('click', () => openModal(table.id));
            card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openModal(table.id); });
            grid.appendChild(card);
        });
    }

    function openModal(tableId) {
        const table = tables.find(t => t.id === tableId);
        if (!table) return;
        activeTableId = tableId;
        const cfg = STATUS_CONFIG[table.status];
        const orders = getOrders(tableId);
        const totalRounds = orders.length;
        document.getElementById('modal-icon').textContent = cfg.icon;
        document.getElementById('modal-icon').style.background =
            table.status === 'available'   ? 'var(--status-available-bg)'   :
            table.status === 'occupied'    ? 'var(--status-occupied-bg)'    :
                                             'var(--status-unavailable-bg)';
        document.getElementById('modal-title').textContent = `Mesa ${table.id}`;
        document.getElementById('modal-subtitle').textContent =
            table.status === 'occupied'
                ? `${table.guests} pessoas · ${totalRounds} rodada${totalRounds !== 1 ? 's' : ''} · Cap. ${table.capacity}`
                : `Capacidade: ${table.capacity} pessoas`;
        renderModalBody(table, orders);
        document.getElementById('modal-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function renderModalBody(table, orders) {
        const body = document.getElementById('modal-body');
        if (table.status === 'available') {
            body.innerHTML = `
                <label class="checkin-label">Quantas pessoas?</label>
                <div class="guest-counter">
                    <button class="counter-btn" onclick="changeGuests(-1)">−</button>
                    <span class="counter-value" id="guest-count">1</span>
                    <button class="counter-btn" onclick="changeGuests(1)">+</button>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn btn-primary-action" onclick="doCheckin()">
                        <svg viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>
                        Fazer check-in
                    </button>
                    <button class="modal-btn btn-danger-action" onclick="setStatus(activeTableId,'unavailable')">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
                        Marcar como indisponível
                    </button>
                </div>`;
            document.getElementById('guest-count')._value = 1;
        } else if (table.status === 'unavailable') {
            body.innerHTML = `
                <div class="modal-actions">
                    <button class="modal-btn btn-warning-action" onclick="setStatus(activeTableId,'available')">
                        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
                        Marcar como disponível
                    </button>
                </div>`;
        } else if (table.status === 'occupied') {
            let ordersHTML = '';
            if (orders.length > 0) {
                orders.forEach((round, idx) => {
                    ordersHTML += `<div class="order-group">
                        <div class="order-group-label">Rodada ${idx + 1} · ${fmtTime(round.timestamp)}</div>
                        ${round.items.map(i => `<div class="order-item"><span class="order-item-name">${escHtml(i.name)}</span><span class="order-item-qty">×${i.qty}</span></div>`).join('')}
                    </div>`;
                });
            } else {
                ordersHTML = `<div class="orders-empty">Nenhum pedido ainda.</div>`;
            }
            body.innerHTML = `
                <div class="orders-section">
                    <button class="orders-toggle-btn" id="orders-toggle-btn" onclick="toggleOrders()">
                        <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                        Pedidos (${orders.length} rodada${orders.length !== 1 ? 's' : ''})
                    </button>
                    <div class="orders-list" id="orders-list">${ordersHTML}</div>
                </div>
                <div class="modal-actions">
                    <button class="modal-btn btn-primary-action" onclick="goToOrder()">
                        <svg viewBox="0 0 24 24"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
                        Realizar pedido
                    </button>
                    <button class="modal-btn btn-danger-action" onclick="goToCheckout()">
                        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                        Fechar conta
                    </button>
                </div>`;
        }
    }

    function closeModal() {
        document.getElementById('modal-overlay').classList.remove('open');
        document.body.style.overflow = '';
        activeTableId = null;
    }

    document.getElementById('modal-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeModal();
    });

    function changeGuests(delta) {
        const el = document.getElementById('guest-count');
        const table = tables.find(t => t.id === activeTableId);
        const max = table ? table.capacity : 12;
        el._value = Math.max(1, Math.min(max, (el._value || 1) + delta));
        el.textContent = el._value;
    }

    function doCheckin() {
        const table = tables.find(t => t.id === activeTableId);
        if (!table) return;
        const guests = document.getElementById('guest-count')._value || 1;
        table.status = 'occupied';
        table.guests = guests;
        sessionStorage.removeItem(`t4u-orders-table-${table.id}`);
        closeModal();
        renderTables();
        showToast(`✓ Check-in — Mesa ${table.id}, ${guests} pessoa${guests > 1 ? 's' : ''}`);
    }

    function setStatus(tableId, newStatus) {
        const table = tables.find(t => t.id === tableId);
        if (!table) return;
        table.status = newStatus;
        if (newStatus === 'available') { table.guests = 0; sessionStorage.removeItem(`t4u-orders-table-${tableId}`); }
        closeModal();
        renderTables();
        const labels = { available: 'disponível', occupied: 'ocupada', unavailable: 'indisponível' };
        showToast(`Mesa ${table.id} marcada como ${labels[newStatus]}`);
    }

    function toggleOrders() {
        const list = document.getElementById('orders-list');
        const btn  = document.getElementById('orders-toggle-btn');
        const open = list.classList.toggle('visible');
        btn.classList.toggle('open', open);
    }

    function goToOrder() { window.location.href = `order.html?table=${activeTableId}`; }
    function goToCheckout() { window.location.href = `checkout.html?table=${activeTableId}&origin=waiter`; }

    // ── INIT ──
    document.addEventListener('DOMContentLoaded', () => {
        T4U.requireAuth(['garcom','admin']);
        seedDemoOrders();
        // Verifica se alguma mesa foi liberada pelo checkout
        tables.forEach(table => {
            const flag = `t4u-release-table-${table.id}`;
            if (sessionStorage.getItem(flag)) {
                table.status = 'available';
                table.guests = 0;
                sessionStorage.removeItem(flag);
                setTimeout(() => showToast(`✓ Mesa ${table.id} liberada com sucesso`), 300);
            }
        });
        renderTables();
    });
</script>
</body>
</html>
