<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cozinha - Menu</title>
        <link rel="stylesheet" href="../styles/Global.css">
        <link rel="stylesheet" href="../styles/kitchen.css">
        <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="sidebar" id="sidebar">
            <button class="menu-toggle" id="menuToggle">☰</button>
            <div class="sidebar-links">
                <button class="sidebar-btn" onclick="window.location.href='kitchen.html'">Pedidos</button>
                <button class="sidebar-btn" onclick="window.location.href='kitchen-menu.html'">Menu</button>
            </div>
        </div>
        <main class="main">
            <header class="topbar">
                <h2>Table4U</h2>
                <div class="user">User 👤</div>
            </header>
            <h1 class="page-title">Menu</h1>
            <div class="divider"></div>
            <div class="tabs">
                <button class="tab active">Entradas</button>
                <button class="tab">Bebidas</button>
                <button class="tab">Pratos</button>
            </div>
            <section class="menu-grid">
                <div class="menu-item selected">Prato X </div>
                <div class="menu-item selected">Prato Y </div>
                <div class="menu-item">Prato A </div>
            </section>
            <div class="menu-actions">
                <button class="action-btn gold">Atualizar Menu</button>
            </div>
        </main>
        <footer>
            <p class="footer-info">Endereço e Contatos</p>
            <p class="powerby">Powered by Table4U</p>
        </footer>
        <script src="../scripts/kitchen.js"></script>
    </body>
</html>
