<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Table4U — Fechar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/shared.css">

    <script>
        (function () {
            var t = localStorage.getItem('t4u-private-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        .receipt-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-card); overflow: hidden; max-width: 480px; margin: 0 auto; }
        .receipt-header { padding: 20px 20px 16px; border-bottom: 2px dashed var(--border); text-align: center; }
        .receipt-brand { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.15em; margin-bottom: 6px; }
        .receipt-table { font-size: 1.4rem; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; margin-bottom: 4px; }
        .receipt-meta { font-size: 0.75rem; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
        .receipt-body { padding: 0 20px; }
        .round-group { padding: 14px 0 0; }
        .round-label { display: flex; align-items: center; gap: 8px; font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); margin-bottom: 8px; }
        .round-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
        .receipt-line { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 0.875rem; }
        .receipt-line-left { flex: 1; min-width: 0; }
        .receipt-line-name { color: var(--text-primary); font-weight: 500; line-height: 1.3; }
        .receipt-line-right { text-align: right; flex-shrink: 0; }
        .receipt-line-qty { font-family: 'IBM Plex Mono', monospace; font-size: 0.7rem; color: var(--text-muted); }
        .receipt-line-price { font-family: 'IBM Plex Mono', monospace; font-size: 0.83rem; font-weight: 500; color: var(--text-primary); }
        .round-subtotal { display: flex; justify-content: flex-end; gap: 8px; padding: 8px 0 12px; border-bottom: 1px solid var(--border); font-size: 0.75rem; color: var(--text-secondary); }
        .round-subtotal span:last-child { font-family: 'IBM Plex Mono', monospace; font-weight: 600; color: var(--text-primary); }
        .receipt-summary { padding: 16px 20px; border-top: 2px dashed var(--border); }
        .summary-line { display: flex; justify-content: space-between; align-items: center; padding: 5px 0; font-size: 0.875rem; }
        .summary-line-label { color: var(--text-secondary); }
        .summary-line-value { font-family: 'IBM Plex Mono', monospace; color: var(--text-primary); font-weight: 500; }
        .service-charge-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; }
        .service-label { display: flex; align-items: center; gap: 8px; }
        .service-label-text { font-size: 0.875rem; color: var(--text-secondary); }
        .service-tag { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); background: var(--accent-subtle); padding: 2px 6px; border-radius: 4px; }
        .switch { width: 40px; height: 22px; border-radius: 11px; border: none; cursor: pointer; display: flex; align-items: center; padding: 2px; transition: background 0.25s; background: var(--toggle-bg); flex-shrink: 0; }
        .switch.on { background: var(--accent); }
        .switch-knob { width: 18px; height: 18px; border-radius: 50%; background: var(--toggle-knob); transition: transform 0.25s cubic-bezier(0.4,0,0.2,1); flex-shrink: 0; }
        .switch.on .switch-knob { transform: translateX(18px); }
        .service-value { font-family: 'IBM Plex Mono', monospace; font-size: 0.875rem; font-weight: 500; color: var(--text-primary); min-width: 72px; text-align: right; }
        .summary-total { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 14px 0 4px; border-top: 2px solid var(--border); }
        .total-label { font-size: 1rem; font-weight: 700; color: var(--text-primary); }
        .total-value { font-family: 'IBM Plex Mono', monospace; font-size: 1.3rem; font-weight: 700; color: var(--accent); }
        .empty-state { text-align: center; padding: 40px 20px; }
        .empty-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .empty-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .empty-desc { font-size: 0.83rem; color: var(--text-secondary); line-height: 1.6; }
        .action-bar { position: fixed; bottom: 0; left: 220px; right: 0; background: var(--bg-topbar); border-top: 1px solid var(--border); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0)); display: flex; gap: 10px; z-index: 30; box-shadow: 0 -4px 20px rgba(0,0,0,0.06); transition: left 0.25s cubic-bezier(0.4,0,0.2,1); }
        @media (max-width: 600px) { .action-bar { left: 0; } }
        .action-btn { flex: 1; padding: 13px 16px; border-radius: 12px; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.15s, transform 0.1s; text-decoration: none; }
        .action-btn:active { transform: scale(0.98); }
        .action-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .btn-back { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--border); flex: 0 0 auto; padding: 13px 18px; }
        .btn-back:hover { background: var(--border); }
        .btn-close { background: var(--accent); color: #fff; }
        .btn-close:hover { background: var(--accent-hover); }

        #confirm-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 110; align-items: flex-end; justify-content: center; }
        #confirm-overlay.open { display: flex; }
        #confirm-modal { background: var(--bg-card); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0)); box-shadow: var(--shadow-modal); animation: sheet-up 0.3s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .confirm-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
        .confirm-icon { font-size: 2.2rem; text-align: center; margin-bottom: 10px; }
        .confirm-title { font-size: 1rem; font-weight: 700; color: var(--text-primary); text-align: center; margin-bottom: 6px; }
        .confirm-total { font-family: 'IBM Plex Mono', monospace; font-size: 1.4rem; font-weight: 700; color: var(--accent); text-align: center; margin-bottom: 16px; }
        .confirm-desc { font-size: 0.82rem; color: var(--text-secondary); text-align: center; line-height: 1.5; margin-bottom: 16px; }
        .confirm-actions { display: flex; gap: 10px; margin-top: 16px; }
        .confirm-btn { flex: 1; padding: 13px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; }
        .confirm-btn:active { transform: scale(0.98); }
        .confirm-btn-secondary { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--border); }
        .confirm-btn-primary { background: #16a34a; color: #fff; }
        .confirm-btn-primary:hover { filter: brightness(0.92); }
        .confirm-btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

        .pagamento-label { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: block; }
        .pagamento-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 4px; }
        .pagamento-btn { display: flex; align-items: center; gap: 8px; padding: 11px 14px; border-radius: 10px; border: 1.5px solid var(--border); background: var(--bg-input); font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); cursor: pointer; transition: all 0.15s; }
        .pagamento-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-subtle); }
        .pagamento-btn.selected { border-color: var(--accent); background: var(--accent); color: #fff; }
        .pagamento-btn .pag-emoji { font-size: 1.1rem; flex-shrink: 0; }
        .pagamento-error { font-size: 0.72rem; color: #dc2626; margin-top: 6px; display: none; }
        .pagamento-error.visible { display: block; }

        .oculto { visibility: hidden; }
        #toast-container { bottom: 90px; }
        @media (max-width: 600px) { #sidebar { display: none; } }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="Navegação lateral">
    <div class="sidebar-header">
        <button class="sidebar-toggle" id="sidebar-toggle-btn" aria-label="Recolher/expandir menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            <span class="sidebar-brand">Table4U</span>
        </button>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer">
        <button id="btn-voltar-admin" class="nav-item oculto" data-tooltip="Sair do modo" onclick="window.location.href='admin.html'">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="nav-label" id="btn-voltar-label">Sair do Modo</span>
        </button>
        <button class="nav-item logout" onclick="logout()" data-tooltip="Sair">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="nav-label">Sair</span>
        </button>
    </div>
</nav>

<div id="main">
    <header id="topbar">
        <div class="topbar-page-info">
            <div class="topbar-page-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
            </div>
            <span class="topbar-page-name" id="topbar-origin-name">Garçom</span>
            <div class="topbar-separator" aria-hidden="true"></div>
            <span class="topbar-page-title" id="topbar-title">Fechar Conta</span>
        </div>
        <div class="topbar-controls">
            <button id="toggle-theme-btn" aria-label="Alternar tema">
                <div class="toggle-knob"><span id="toggle-icon">☀️</span></div>
            </button>
            <button id="profile-btn" aria-label="Menu do perfil">
                <span id="profile-initials">G</span>
            </button>
        </div>
    </header>

    <div id="profile-dropdown" role="menu">
        <div class="dropdown-header">
            <div class="dropdown-avatar" id="dropdown-avatar">G</div>
            <div>
                <div class="dropdown-name" id="dropdown-name">Garçom</div>
                <div class="dropdown-role" id="dropdown-role">garcom@rest.com</div>
            </div>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair
        </button>
    </div>

    <main id="content"></main>
</div>

<div class="action-bar" id="action-bar" style="display:none">
    <a class="action-btn btn-back" id="btn-back" href="waiter.html">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </a>
    <button class="action-btn btn-close" onclick="openConfirmModal()">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
        Fechar e liberar mesa
    </button>
</div>

<div id="confirm-overlay" role="dialog" aria-modal="true">
    <div id="confirm-modal">
        <div class="confirm-handle" aria-hidden="true"></div>
        <div class="confirm-icon">💳</div>
        <div class="confirm-title">Confirmar fechamento?</div>
        <div class="confirm-total" id="confirm-total-display">R$ 0,00</div>

        <label class="pagamento-label">Forma de pagamento</label>
        <div class="pagamento-grid">
            <button class="pagamento-btn" data-forma="pix" onclick="selectPagamento('pix', this)">
                <span class="pag-emoji">📱</span> Pix
            </button>
            <button class="pagamento-btn" data-forma="credito" onclick="selectPagamento('credito', this)">
                <span class="pag-emoji">💳</span> Crédito
            </button>
            <button class="pagamento-btn" data-forma="debito" onclick="selectPagamento('debito', this)">
                <span class="pag-emoji">💳</span> Débito
            </button>
            <button class="pagamento-btn" data-forma="dinheiro" onclick="selectPagamento('dinheiro', this)">
                <span class="pag-emoji">💵</span> Dinheiro
            </button>
        </div>
        <div class="pagamento-error" id="pagamento-error">Selecione a forma de pagamento.</div>

        <p class="confirm-desc">A conta será encerrada e a mesa ficará disponível novamente.</p>
        <div class="confirm-actions">
            <button class="confirm-btn confirm-btn-secondary" onclick="closeConfirmModal()">Cancelar</button>
            <button class="confirm-btn confirm-btn-primary" id="btn-close-table" onclick="closeTable()">✓ Confirmar</button>
        </div>
    </div>
</div>

<div id="toast-container" aria-live="polite"></div>

<script src="../scripts/shared.js" defer></script>

<script>
    const params  = new URLSearchParams(window.location.search);
    const tableId = params.get('table') || '?';
    const origin  = params.get('origin') || 'waiter';
    const backUrl = origin === 'reception' ? 'reception.html' : 'waiter.html';

    let serviceChargeOn = true;
    let subtotalGlobal  = 0;
    let atendimentoData = null;
    let formaPagamento  = null;

    function fmt(n) { return 'R$ ' + Number(n).toFixed(2).replace('.', ','); }
    function fmtTime(ts) { return new Date(ts).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); }
    function fmtDate(ts) { return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit' }); }

    function selectPagamento(forma, el) {
        formaPagamento = forma;
        document.querySelectorAll('.pagamento-btn').forEach(b => b.classList.remove('selected'));
        el.classList.add('selected');
        document.getElementById('pagamento-error').classList.remove('visible');
    }

    function renderSidebar() {
        const nav = document.getElementById('sidebar-nav');
        if (origin === 'reception') {
            nav.innerHTML = `
                <div class="nav-section-label">Recepção</div>
                <a class="nav-item" href="reception.html" data-tooltip="Mesas">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span class="nav-label">Mesas</span>
                </a>
                <button class="nav-item active" data-tooltip="Fechar Conta">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <span class="nav-label">Fechar Conta</span>
                </button>`;
        } else {
            nav.innerHTML = `
                <div class="nav-section-label">Garçom</div>
                <a class="nav-item" href="waiter.html" data-tooltip="Mesas">
                    <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                    <span class="nav-label">Mesas</span>
                </a>
                <button class="nav-item active" data-tooltip="Fechar Conta">
                    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                    <span class="nav-label">Fechar Conta</span>
                </button>`;
        }
    }

    async function loadAndRender() {
        const content = document.getElementById('content');
        content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Carregando...</div>';

        try {
            const res = await fetch(`/api/mesas/${tableId}/pedidos`);
            if (!res.ok) throw new Error();
            atendimentoData = await res.json();
        } catch (_) {
            content.innerHTML = '<div style="padding:40px;text-align:center;color:var(--text-muted);">Erro ao carregar pedidos.</div>';
            return;
        }

        const pedidos = atendimentoData.pedidos || [];
        document.getElementById('topbar-title').textContent = `Fechar Conta — Mesa ${tableId}`;

        if (!pedidos.length) {
            content.innerHTML = `
                <div class="receipt-card">
                    <div class="empty-state">
                        <div class="empty-icon">🧾</div>
                        <div class="empty-title">Nenhum pedido registrado</div>
                        <p class="empty-desc">Esta mesa ainda não possui pedidos.</p>
                    </div>
                </div>
                <div style="max-width:480px;margin:12px auto 0">
                    <a class="action-btn btn-back" href="${backUrl}" style="display:flex;align-items:center;gap:8px;padding:13px 18px;background:var(--accent-subtle);color:var(--accent);border:1px solid var(--border);border-radius:12px;text-decoration:none;font-weight:600;font-size:0.875rem">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                        Voltar às mesas
                    </a>
                </div>`;
            return;
        }

        subtotalGlobal = pedidos.reduce((s, p) => s + p.preco * p.quantidade, 0);
        const serviceAmt = serviceChargeOn ? subtotalGlobal * 0.1 : 0;
        const totalFinal = subtotalGlobal + serviceAmt;
        const checkin    = atendimentoData.checkin;

        const itemsHTML = pedidos.map(p => `
            <div class="receipt-line">
                <div class="receipt-line-left">
                    <div class="receipt-line-name">${p.nome}</div>
                </div>
                <div class="receipt-line-right">
                    <div class="receipt-line-qty">×${p.quantidade}</div>
                    <div class="receipt-line-price">${fmt(p.preco * p.quantidade)}</div>
                </div>
            </div>`).join('');

        content.innerHTML = `
            <div class="receipt-card">
                <div class="receipt-header">
                    <div class="receipt-brand">Table4U · Nota de consumo</div>
                    <div class="receipt-table">Mesa ${tableId}</div>
                    <div class="receipt-meta">${checkin ? `Abertura ${fmtDate(checkin)} ${fmtTime(checkin)}` : ''} · ${pedidos.length} item${pedidos.length !== 1 ? 'ns' : ''}</div>
                </div>
                <div class="receipt-body">
                    <div class="round-group">
                        <div class="round-label">Consumo</div>
                        ${itemsHTML}
                        <div class="round-subtotal">
                            <span>Subtotal</span>
                            <span>${fmt(subtotalGlobal)}</span>
                        </div>
                    </div>
                </div>
                <div class="receipt-summary">
                    <div class="summary-line">
                        <span class="summary-line-label">Subtotal</span>
                        <span class="summary-line-value" id="subtotal-display">${fmt(subtotalGlobal)}</span>
                    </div>
                    <div class="service-charge-row">
                        <div class="service-label">
                            <span class="service-label-text">Taxa de serviço</span>
                            <span class="service-tag">10%</span>
                        </div>
                        <div style="display:flex;align-items:center;gap:10px">
                            <span class="service-value" id="service-display">${fmt(serviceAmt)}</span>
                            <button class="switch ${serviceChargeOn ? 'on' : ''}" id="service-switch" onclick="toggleService()" aria-label="Incluir taxa de serviço">
                                <div class="switch-knob"></div>
                            </button>
                        </div>
                    </div>
                    <div class="summary-total">
                        <span class="total-label">Total</span>
                        <span class="total-value" id="total-display">${fmt(totalFinal)}</span>
                    </div>
                </div>
            </div>`;

        document.getElementById('action-bar').style.display = 'flex';
        document.getElementById('btn-back').href = backUrl;
        updateConfirmTotal();
    }

    function toggleService() {
        serviceChargeOn = !serviceChargeOn;
        const serviceAmt = serviceChargeOn ? subtotalGlobal * 0.1 : 0;
        const totalFinal = subtotalGlobal + serviceAmt;
        const sw = document.getElementById('service-switch');
        if (sw) sw.classList.toggle('on', serviceChargeOn);
        const sd = document.getElementById('service-display');
        if (sd) sd.textContent = fmt(serviceAmt);
        const td = document.getElementById('total-display');
        if (td) td.textContent = fmt(totalFinal);
        updateConfirmTotal();
    }

    function updateConfirmTotal() {
        const serviceAmt = serviceChargeOn ? subtotalGlobal * 0.1 : 0;
        const total = subtotalGlobal + serviceAmt;
        const el = document.getElementById('confirm-total-display');
        if (el) el.textContent = fmt(total);
    }

    function openConfirmModal() {
        formaPagamento = null;
        document.querySelectorAll('.pagamento-btn').forEach(b => b.classList.remove('selected'));
        document.getElementById('pagamento-error').classList.remove('visible');
        updateConfirmTotal();
        document.getElementById('confirm-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeConfirmModal() {
        document.getElementById('confirm-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    document.getElementById('confirm-overlay').addEventListener('click', function(e) {
        if (e.target === this) closeConfirmModal();
    });

    async function closeTable() {
        if (!formaPagamento) {
            document.getElementById('pagamento-error').classList.add('visible');
            return;
        }

        const btn = document.getElementById('btn-close-table');
        btn.disabled = true;
        btn.textContent = 'Processando...';

        const serviceAmt = serviceChargeOn ? subtotalGlobal * 0.1 : 0;
        const totalFinal = subtotalGlobal + serviceAmt;

        try {
            // 1. Registra pagamento
            const resPag = await fetch('/api/pagamento', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    atendimento_id: atendimentoData.atendimento_id,
                    forma: formaPagamento,
                    valor: totalFinal
                })
            });
            if (!resPag.ok) throw new Error('Erro ao registrar pagamento');

            // 2. Faz checkout da mesa
            const resCheckout = await fetch(`/api/mesas/${tableId}/checkout`, { method: 'POST' });
            if (!resCheckout.ok) throw new Error('Erro ao fazer checkout');

            closeConfirmModal();
            showToast('✓ Conta fechada! Mesa liberada.');
            setTimeout(() => { window.location.href = backUrl; }, 1200);
        } catch (err) {
            console.error(err);
            showToast('Erro ao fechar conta. Tente novamente.');
            btn.disabled = false;
            btn.textContent = '✓ Confirmar';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        T4U.requireAuth(['garcom', 'recepcao', 'admin']);
        const user = T4U.getUser();
        if (user.role === 'admin') {
            const btn   = document.getElementById('btn-voltar-admin');
            const label = document.getElementById('btn-voltar-label');
            btn.classList.remove('oculto');
            label.textContent = origin === 'reception' ? 'Sair do Modo Recepção' : 'Sair do Modo Garçom';
        }
        document.getElementById('topbar-origin-name').textContent = origin === 'reception' ? 'Recepção' : 'Garçom';
        renderSidebar();
        loadAndRender();
    });
</script>
</body>
</html>
