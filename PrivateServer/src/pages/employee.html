<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table4U - Funcionários</title>
    <link rel="stylesheet" href="../../../PublicServer/src/styles/global.css">
    <link rel="stylesheet" href="../styles/employee.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body class="employee-body">

    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
    <nav class="sidebar" id="sidebar">

        <div class="sidebar-header">
            <h1 class="nome-restaurante" style="font-size: 1.5rem;">Table4U</h1>
            <p style="color: rgba(255,255,255,0.5); font-size: 0.8rem;">Administrador</p>
        </div>

        <ul class="sidebar-menu">
            <li><a href="admin.html">Início / Dashboard</a></li>
            <li><a href="#">Restaurante</a></li>
            <li><a href="#">Faturamento</a></li>
            <li><a href="#">Pratos / Menu</a></li>
            <li><a href="employee.html" class="ativo">Funcionários</a></li>
            <li><a href="#">Modo Funcionário</a></li>
            <li><a href="#">Modo Cozinha</a></li>
        </ul>
        
    </nav>

    <header class="employee-header">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <h2 class="page-title">Funcionários</h2>
            <div style="width: 24px;"></div>
    </header>

    <button class="perfil-btn" onclick="togglePerfil()">
        <div class="perfil-iniciais"></div>
    </button>

    <div id="popup-perfil" class="popup-perfil">
        <div class="perfil-topo">
            <div class="perfil-avatar-grande"></div>
            <div>
                <p class="perfil-nome"></p>
                <p class="perfil-email"></p>
            </div>
        </div>
        <a href="#" class="perfil-menu-item sair" onclick="sairFuncionario()">Sair</a>
    </div>

    <main class="main-content">
        <section class="employees-container">

            <div class="employees-list" id="employeeList">
            </div>

            <button class="add-btn" id="addEmployeeBtn">+ Adicionar funcionário</button>

        </section>

    </main>

    <footer>
        <p class="footer-info">Endereço e Contatos</p>
        <p class="powerby">Powered by Table4U</p>
    </footer>
    
    <script src="../../../PublicServer/src/scripts/profile.js"></script>
    <script src="../scripts/employee.js"></script>
</body>
</html>
