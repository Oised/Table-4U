<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table4U — Realizar Pedido</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script>
        (function () {
            var saved = localStorage.getItem('t4u-private-theme');
            document.documentElement.setAttribute('data-theme', saved || 'light');
        })();
    </script>
    <style>
        :root,
        [data-theme="light"] {
            --bg-page:         #f0f2f5;
            --bg-card:         #ffffff;
            --bg-sidebar:      #1c2333;
            --bg-sidebar-hover:#232e45;
            --bg-topbar:       #ffffff;
            --text-primary:    #111827;
            --text-secondary:  #6b7280;
            --text-muted:      #9ca3af;
            --text-on-dark:    #f9fafb;
            --text-sidebar:    #cbd5e1;
            --text-sidebar-muted: #64748b;
            --border:          #e5e7eb;
            --border-focus:    #2c3e50;
            --accent:          #2c3e50;
            --accent-hover:    #1a252f;
            --accent-subtle:   rgba(44,62,80,0.07);
            --shadow-card:     0 1px 3px rgba(0,0,0,0.07), 0 4px 16px rgba(0,0,0,0.05);
            --toggle-bg:       #e5e7eb;
            --toggle-knob:     #ffffff;
        }

        [data-theme="dark"] {
            --bg-page:         #111827;
            --bg-card:         #1f2937;
            --bg-sidebar:      #0d1117;
            --bg-sidebar-hover:#161d2d;
            --bg-topbar:       #1f2937;
            --text-primary:    #f9fafb;
            --text-secondary:  #9ca3af;
            --text-muted:      #6b7280;
            --text-on-dark:    #f9fafb;
            --text-sidebar:    #cbd5e1;
            --text-sidebar-muted: #475569;
            --border:          #374151;
            --border-focus:    #6b8cae;
            --accent:          #3a6ea5;
            --accent-hover:    #4a80be;
            --accent-subtle:   rgba(58,110,165,0.12);
            --shadow-card:     0 1px 3px rgba(0,0,0,0.4), 0 4px 16px rgba(0,0,0,0.3);
            --toggle-bg:       #374151;
            --toggle-knob:     #9ca3af;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            display: flex;
            transition: background 0.25s, color 0.25s;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        #sidebar {
            width: 220px; min-width: 220px;
            background: var(--bg-sidebar);
            display: flex; flex-direction: column;
            height: 100vh;
            transition: width 0.25s cubic-bezier(0.4,0,0.2,1), min-width 0.25s cubic-bezier(0.4,0,0.2,1);
            overflow: hidden; flex-shrink: 0; z-index: 50;
        }
        #sidebar.collapsed { width: 56px; min-width: 56px; }

        .sidebar-header { border-bottom: 1px solid rgba(255,255,255,0.06); min-height: 60px; }

        .sidebar-toggle {
            background: none; border: none; cursor: pointer;
            color: var(--text-sidebar-muted);
            padding: 18px 14px;
            display: flex; align-items: center; gap: 10px;
            width: 100%;
            transition: color 0.2s, background 0.2s;
            white-space: nowrap; overflow: hidden;
        }
        .sidebar-toggle:hover { color: var(--text-sidebar); background: var(--bg-sidebar-hover); }
        .sidebar-toggle svg { width: 18px; height: 18px; flex-shrink: 0; }
        .sidebar-brand {
            font-family: 'IBM Plex Mono', monospace; font-size: 0.9rem; font-weight: 500;
            color: var(--text-on-dark); transition: opacity 0.2s;
        }
        #sidebar.collapsed .sidebar-brand { opacity: 0; width: 0; }

        .sidebar-nav { flex: 1; padding: 12px 0; overflow-y: auto; overflow-x: hidden; }

        .nav-section-label {
            font-size: 0.62rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: 0.1em; color: var(--text-sidebar-muted);
            padding: 8px 16px 4px; white-space: nowrap; overflow: hidden;
            transition: opacity 0.2s;
        }
        #sidebar.collapsed .nav-section-label { opacity: 0; }

        .nav-item {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px; color: var(--text-sidebar);
            font-size: 0.875rem; border: none; background: none;
            width: 100%; text-align: left; cursor: pointer;
            transition: background 0.15s, color 0.15s;
            white-space: nowrap; text-decoration: none; position: relative;
        }
        .nav-item:hover { background: var(--bg-sidebar-hover); color: #fff; }
        .nav-item.active { background: var(--bg-sidebar-hover); color: #fff; }
        .nav-item.active::before {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0;
            width: 3px; background: var(--accent); border-radius: 0 2px 2px 0;
        }
        .nav-item svg {
            width: 18px; height: 18px; flex-shrink: 0;
            fill: none; stroke: currentColor; stroke-width: 1.8;
            stroke-linecap: round; stroke-linejoin: round;
        }
        .nav-label { transition: opacity 0.2s; white-space: nowrap; overflow: hidden; }
        #sidebar.collapsed .nav-label { opacity: 0; width: 0; overflow: hidden; }

        #sidebar.collapsed .nav-item[data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute; left: calc(100% + 8px); top: 50%; transform: translateY(-50%);
            background: #1c2333; color: #fff; font-size: 0.78rem;
            padding: 5px 10px; border-radius: 6px; white-space: nowrap;
            pointer-events: none; z-index: 200; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .sidebar-footer { padding: 0; border-top: 1px solid rgba(255,255,255,0.06); }
        .nav-item.logout { color: #f87171; }
        .nav-item.logout:hover { background: rgba(248,113,113,0.1); color: #fca5a5; }

        /* ── MAIN ── */
        #main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* ── TOPBAR ── */
        #topbar {
            height: 56px; background: var(--bg-topbar);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; gap: 12px;
            flex-shrink: 0; transition: background 0.25s, border-color 0.25s;
        }
        .topbar-page-info { display: flex; align-items: center; gap: 8px; flex: 1; }
        .topbar-page-icon {
            width: 28px; height: 28px; background: var(--accent-subtle);
            border-radius: 7px; display: flex; align-items: center; justify-content: center;
        }
        .topbar-page-icon svg {
            width: 14px; height: 14px; fill: none; stroke: var(--accent);
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }
        .topbar-page-name { font-size: 0.85rem; font-weight: 500; color: var(--text-secondary); }
        .topbar-separator { width: 1px; height: 14px; background: var(--border); }
        .topbar-page-title { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
        .topbar-controls { display: flex; align-items: center; gap: 10px; }

        #toggle-theme-btn {
            width: 44px; height: 24px; border-radius: 12px;
            border: 1.5px solid var(--border); background: var(--toggle-bg);
            cursor: pointer; display: flex; align-items: center; padding: 2px;
            transition: background 0.25s, border-color 0.25s;
        }
        .toggle-knob {
            width: 18px; height: 18px; border-radius: 50%;
            background: var(--toggle-knob);
            transition: transform 0.25s cubic-bezier(0.4,0,0.2,1);
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; flex-shrink: 0;
        }
        [data-theme="dark"] .toggle-knob { transform: translateX(20px); }

        #profile-btn {
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--border);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-family: 'IBM Plex Mono', monospace; font-size: 0.72rem; font-weight: 500;
            color: #fff; transition: border-color 0.2s, transform 0.15s; flex-shrink: 0;
        }
        #profile-btn:hover { border-color: var(--accent); transform: scale(1.05); }

        #profile-dropdown {
            display: none; position: absolute; top: 52px; right: 16px;
            width: 240px; background: var(--bg-card); border: 1px solid var(--border);
            border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.18);
            z-index: 200; overflow: hidden; animation: dropdown-in 0.18s ease both;
        }
        #profile-dropdown.open { display: block; }
        @keyframes dropdown-in { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:translateY(0); } }

        .dropdown-header {
            padding: 16px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; gap: 10px;
        }
        .dropdown-avatar {
            width: 36px; height: 36px; border-radius: 50%; background: var(--accent);
            display: flex; align-items: center; justify-content: center;
            font-family: 'IBM Plex Mono', monospace; font-size: 0.78rem; color: #fff; flex-shrink: 0;
        }
        .dropdown-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
        .dropdown-role { font-size: 0.72rem; color: var(--text-muted); margin-top: 1px; }
        .dropdown-item {
            display: flex; align-items: center; gap: 10px; padding: 11px 16px;
            font-size: 0.83rem; color: var(--text-secondary); cursor: pointer;
            transition: background 0.15s, color 0.15s; border: none; background: none;
            width: 100%; text-align: left; text-decoration: none;
        }
        .dropdown-item:hover { background: var(--accent-subtle); color: var(--text-primary); }
        .dropdown-item svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        .dropdown-item.danger { color: #ef4444; }
        .dropdown-item.danger:hover { background: rgba(239,68,68,0.07); }
        .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }

        /* ── CONTENT ── */
        #content { flex: 1; overflow-y: auto; padding: 24px 20px; display: flex; align-items: center; justify-content: center; }

        .wip-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: var(--shadow-card);
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .wip-icon { font-size: 2.8rem; margin-bottom: 16px; }

        .wip-title {
            font-size: 1.1rem; font-weight: 600;
            color: var(--text-primary); margin-bottom: 8px;
        }

        .wip-desc {
            font-size: 0.85rem; color: var(--text-secondary);
            line-height: 1.6; margin-bottom: 8px;
        }

        .wip-table-info {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.78rem; color: var(--text-muted);
            margin-bottom: 28px;
        }

        .btn-back {
            display: inline-flex; align-items: center; gap: 8px;
            padding: 11px 20px;
            background: var(--accent-subtle); color: var(--accent);
            border: 1px solid var(--border); border-radius: 10px;
            font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600;
            cursor: pointer; text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }
        .btn-back:hover { background: var(--border); color: var(--text-primary); }
        .btn-back svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        @media (max-width: 600px) {
            #sidebar { display: none; }
            #content { padding: 16px; }
            .wip-card { padding: 36px 24px; }
        }
    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <nav id="sidebar" aria-label="Navegação lateral">
        <div class="sidebar-header">
            <button class="sidebar-toggle" id="sidebar-toggle-btn" aria-label="Recolher/expandir menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6"  x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
                <span class="sidebar-brand">Table4U</span>
            </button>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section-label">Garçom</div>
            <a class="nav-item" href="waiter.html" data-tooltip="Mesas">
                <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
                <span class="nav-label">Mesas</span>
            </a>
            <button class="nav-item active" data-tooltip="Pedidos">
                <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
                <span class="nav-label">Pedidos</span>
            </button>
        </div>
        <div class="sidebar-footer">
            <button class="nav-item logout" data-tooltip="Sair" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                <span class="nav-label">Sair</span>
            </button>
        </div>
    </nav>

    <!-- MAIN -->
    <div id="main">
        <header id="topbar">
            <div class="topbar-page-info">
                <div class="topbar-page-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>
                </div>
                <span class="topbar-page-name">Garçom</span>
                <div class="topbar-separator" aria-hidden="true"></div>
                <span class="topbar-page-title">Realizar Pedido</span>
            </div>
            <div class="topbar-controls">
                <button id="toggle-theme-btn" aria-label="Alternar tema">
                    <div class="toggle-knob"><span id="toggle-icon">☀️</span></div>
                </button>
                <button id="profile-btn" aria-label="Menu do perfil">
                    <span id="profile-initials">G</span>
                </button>
            </div>
        </header>

        <div id="profile-dropdown">
            <div class="dropdown-header">
                <div class="dropdown-avatar" id="dropdown-avatar">G</div>
                <div>
                    <div class="dropdown-name" id="dropdown-name">Garçom</div>
                    <div class="dropdown-role" id="dropdown-role">garcom@rest.com</div>
                </div>
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-item danger" onclick="logout()">
                <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                Sair
            </button>
        </div>

        <main id="content">
            <div class="wip-card">
                <div class="wip-icon">🍽️</div>
                <div class="wip-title">Realizar Pedido</div>
                <p class="wip-desc">Esta página está em desenvolvimento. Em breve você poderá anotar e enviar pedidos diretamente para a cozinha a partir daqui.</p>
                <p class="wip-table-info" id="table-info">—</p>
                <a class="btn-back" href="waiter.html">
                    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
                    Voltar às mesas
                </a>
            </div>
        </main>
    </div>

    <script>
        // Table param
        const params = new URLSearchParams(window.location.search);
        const tableId = params.get('table');
        if (tableId) document.getElementById('table-info').textContent = `Mesa ${tableId}`;

        // Theme
        const THEME_KEY = 't4u-private-theme';
        function applyTheme(t) {
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem(THEME_KEY, t);
            document.getElementById('toggle-icon').textContent = t === 'dark' ? '🌙' : '☀️';
        }
        applyTheme(localStorage.getItem(THEME_KEY) || 'light');
        document.getElementById('toggle-theme-btn').addEventListener('click', () => {
            applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light');
        });

        // Sidebar
        document.getElementById('sidebar-toggle-btn').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('collapsed');
        });

        // Profile
        function getUser() {
            try { return JSON.parse(sessionStorage.getItem('t4u-user')) || { label: 'Garçom', email: 'garcom@rest.com' }; }
            catch { return { label: 'Garçom', email: 'garcom@rest.com' }; }
        }
        const user = getUser();
        const initials = user.label.split(' ').map(w => w[0]).join('').slice(0,2).toUpperCase();
        document.getElementById('profile-initials').textContent = initials;
        document.getElementById('dropdown-avatar').textContent  = initials;
        document.getElementById('dropdown-name').textContent    = user.label;
        document.getElementById('dropdown-role').textContent    = user.email;

        const profileBtn = document.getElementById('profile-btn');
        const profileDropdown = document.getElementById('profile-dropdown');
        profileBtn.addEventListener('click', e => { e.stopPropagation(); profileDropdown.classList.toggle('open'); });
        document.addEventListener('click', () => profileDropdown.classList.remove('open'));
        profileDropdown.addEventListener('click', e => e.stopPropagation());

        function logout() { sessionStorage.removeItem('t4u-user'); window.location.href = 'login.html'; }
    </script>
</body>
</html>
