<!DOCTYPE html>
<html lang="pt" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Table4U — Realizar Pedido</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/shared.css">

    <!-- Tema aplicado antes do paint para evitar flash -->
    <script>
        (function () {
            var t = localStorage.getItem('t4u-private-theme') || 'light';
            document.documentElement.setAttribute('data-theme', t);
        })();
    </script>

    <style>
        /* ── CONTENT ── */
        #content { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 12px 12px 120px; scroll-behavior: smooth; }

        /* ── CATEGORY ── */
        .category-section { margin-bottom: 4px; }
        .category-header { display: flex; align-items: center; gap: 8px; padding: 12px 4px 8px; position: sticky; top: 0; z-index: 10; background: var(--bg-page); }
        .category-icon { font-size: 1rem; }
        .category-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-muted); }

        /* ── DISH CARD ── */
        .dish-card { background: var(--bg-card); border: 1.5px solid var(--border); border-radius: 14px; margin-bottom: 10px; overflow: hidden; box-shadow: var(--shadow-card); transition: border-color 0.2s; }
        .dish-card.has-quantity { border-color: var(--accent); }
        .dish-main { display: flex; align-items: center; gap: 10px; padding: 13px 12px; }
        .dish-info { flex: 1; min-width: 0; }
        .dish-name { font-size: 0.92rem; font-weight: 600; color: var(--text-primary); margin-bottom: 2px; }
        .dish-price { font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; color: var(--accent); font-weight: 500; }
        .dish-expand-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 5px; border-radius: 7px; display: flex; align-items: center; transition: color 0.15s, background 0.15s; flex-shrink: 0; }
        .dish-expand-btn:hover { color: var(--text-secondary); background: var(--accent-subtle); }
        .dish-expand-btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s; }
        .dish-card.expanded .dish-expand-btn svg { transform: rotate(180deg); }
        .note-badge { display: none; width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; }
        .dish-card.has-note .note-badge { display: block; }
        .dish-qty { display: flex; flex-direction: column; align-items: center; gap: 1px; flex-shrink: 0; }
        .qty-btn { width: 28px; height: 26px; border-radius: 6px; border: 1.5px solid var(--border); background: var(--bg-input); color: var(--text-primary); font-size: 0.75rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.15s, border-color 0.15s; line-height: 1; }
        .qty-btn:hover { border-color: var(--border-focus); background: var(--accent-subtle); }
        .qty-btn:active { transform: scale(0.9); }
        .qty-value { font-family: 'IBM Plex Mono', monospace; font-size: 0.95rem; font-weight: 500; color: var(--text-primary); width: 30px; text-align: center; border: none; background: none; outline: none; cursor: text; }
        .qty-value::-webkit-outer-spin-button, .qty-value::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .qty-value[type=number] { -moz-appearance: textfield; }
        .dish-panel { display: none; padding: 0 12px 12px; border-top: 1px solid var(--border); }
        .dish-card.expanded .dish-panel { display: block; }
        .dish-description { font-size: 0.8rem; color: var(--text-secondary); line-height: 1.55; margin-bottom: 10px; padding-top: 10px; }
        .note-label { font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); margin-bottom: 5px; }
        .note-input { width: 100%; padding: 8px 11px; background: var(--note-bg); border: 1px solid var(--note-border); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; color: var(--text-primary); outline: none; resize: none; min-height: 60px; transition: border-color 0.2s; }
        .note-input::placeholder { color: var(--text-muted); font-weight: 300; }
        .note-input:focus { border-color: var(--border-focus); }

        /* ── FABs ── */
        .fab-container { position: fixed; bottom: 20px; right: 16px; display: flex; flex-direction: column; gap: 10px; z-index: 30; align-items: flex-end; }
        .fab { display: flex; align-items: center; gap: 8px; padding: 13px 18px; border-radius: 50px; border: none; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600; box-shadow: var(--shadow-fab); transition: transform 0.15s, box-shadow 0.15s; white-space: nowrap; }
        .fab:hover { transform: translateY(-2px); }
        .fab:active { transform: scale(0.97); }
        .fab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
        .fab-confirm { background: var(--accent); color: #fff; }
        .fab-confirm:hover { background: var(--accent-hover); }
        .fab-cancel { background: var(--bg-card); color: var(--danger); border: 1.5px solid var(--danger-border); box-shadow: var(--shadow-card); }
        .fab-cancel:hover { background: var(--danger-subtle); }
        .fab-badge { background: rgba(255,255,255,0.22); color: #fff; font-size: 0.7rem; font-weight: 700; padding: 1px 7px; border-radius: 20px; font-family: 'IBM Plex Mono', monospace; }

        /* ── REVIEW MODAL ── */
        #modal-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 100; align-items: flex-end; justify-content: center; }
        #modal-overlay.open { display: flex; }
        #modal { background: var(--bg-card); border-radius: 20px 20px 0 0; width: 100%; max-width: 540px; max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-modal); animation: sheet-up 0.3s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 12px auto 0; }
        .modal-header { padding: 14px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
        .modal-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); }
        .modal-subtitle { font-size: 0.76rem; color: var(--text-secondary); margin-top: 2px; }
        .modal-close { background: none; border: none; cursor: pointer; color: var(--text-muted); padding: 4px; border-radius: 6px; display: flex; transition: color 0.15s, background 0.15s; }
        .modal-close:hover { color: var(--text-primary); background: var(--accent-subtle); }
        .modal-close svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
        .modal-body { padding: 14px 20px; }
        .review-item { display: flex; justify-content: space-between; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--border); gap: 12px; }
        .review-item:last-child { border-bottom: none; }
        .review-item-left { flex: 1; min-width: 0; }
        .review-item-name { font-size: 0.875rem; font-weight: 600; color: var(--text-primary); }
        .review-item-note { font-size: 0.74rem; color: var(--text-muted); margin-top: 3px; font-style: italic; }
        .review-item-right { text-align: right; flex-shrink: 0; }
        .review-item-qty { font-size: 0.7rem; color: var(--text-muted); font-family: 'IBM Plex Mono', monospace; }
        .review-item-price { font-size: 0.83rem; font-weight: 600; color: var(--text-primary); font-family: 'IBM Plex Mono', monospace; }
        .review-total { display: flex; justify-content: space-between; align-items: center; padding: 14px 0 4px; border-top: 2px solid var(--border); margin-top: 4px; }
        .review-total-label { font-size: 0.875rem; font-weight: 700; color: var(--text-primary); }
        .review-total-value { font-family: 'IBM Plex Mono', monospace; font-size: 1rem; font-weight: 700; color: var(--accent); }
        .modal-actions { display: flex; gap: 10px; padding: 14px 20px 20px; }
        .modal-btn { flex: 1; padding: 13px; border-radius: 10px; border: none; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: background 0.15s, transform 0.1s; }
        .modal-btn:active { transform: scale(0.98); }
        .modal-btn-primary { background: var(--accent); color: #fff; }
        .modal-btn-primary:hover { background: var(--accent-hover); }
        .modal-btn-secondary { background: var(--accent-subtle); color: var(--accent); border: 1px solid var(--border); }
        .modal-btn-secondary:hover { background: var(--border); }

        /* ── CANCEL MODAL ── */
        #cancel-overlay { display: none; position: fixed; inset: 0; background: var(--overlay); z-index: 110; align-items: center; justify-content: center; padding: 20px; }
        #cancel-overlay.open { display: flex; }
        #cancel-modal { background: var(--bg-card); border-radius: 16px; padding: 24px; width: 100%; max-width: 300px; box-shadow: var(--shadow-modal); animation: fade-in 0.2s ease both; }
        @keyframes fade-in { from { opacity:0; transform:scale(0.95); } to { opacity:1; transform:scale(1); } }
        .cancel-icon { font-size: 2rem; text-align: center; margin-bottom: 12px; }
        .cancel-title { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); text-align: center; margin-bottom: 8px; }
        .cancel-desc { font-size: 0.82rem; color: var(--text-secondary); text-align: center; line-height: 1.5; margin-bottom: 20px; }
        .cancel-actions { display: flex; gap: 10px; }

        /* Toast já vem do shared.css, mas ajustamos a posição para não colidir com FABs */
        #toast-container { bottom: 100px; }

        @media (max-width: 600px) { #sidebar { display: none; } }
    </style>
</head>
<body>

<nav id="sidebar" aria-label="Navegação lateral">
    <div class="sidebar-header">
        <button class="sidebar-toggle" id="sidebar-toggle-btn" aria-label="Recolher/expandir menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="3" y1="6" x2="21" y2="6"/>
                <line x1="3" y1="12" x2="21" y2="12"/>
                <line x1="3" y1="18" x2="21" y2="18"/>
            </svg>
            <span class="sidebar-brand">Table4U</span>
        </button>
    </div>
    <div class="sidebar-nav">
        <div class="nav-section-label">Garçom</div>
        <a class="nav-item" href="waiter.html" data-tooltip="Mesas" id="nav-mesas" onclick="handleNavMesas(event)">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
            <span class="nav-label">Mesas</span>
        </a>
        <button class="nav-item active" data-tooltip="Pedido">
            <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
            <span class="nav-label">Pedido</span>
        </button>
        <div class="nav-section-label" style="margin-top:8px;">Ir para</div>
        <div id="sidebar-categories"></div>
        <div style="border-top:1px solid rgba(255,255,255,0.06);margin-top:8px;padding-top:8px;">
            <button class="nav-item" data-tooltip="Fechar Conta" onclick="showToast('Você não pode fazer isso aqui!')">
                <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
                <span class="nav-label">Fechar Conta</span>
            </button>
        </div>
    </div>
    <div class="sidebar-footer">
        <button class="nav-item logout" onclick="logout()" data-tooltip="Sair">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span class="nav-label">Sair</span>
        </button>
    </div>
</nav>

<div id="main">
    <header id="topbar">
        <div class="topbar-page-info">
            <div class="topbar-page-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/></svg>
            </div>
            <span class="topbar-page-name">Garçom</span>
            <div class="topbar-separator" aria-hidden="true"></div>
            <span class="topbar-page-title" id="topbar-title">Pedido — Mesa —</span>
        </div>
        <div class="topbar-controls">
            <button id="toggle-theme-btn" aria-label="Alternar tema">
                <div class="toggle-knob"><span id="toggle-icon">☀️</span></div>
            </button>
            <button id="profile-btn" aria-label="Menu do perfil">
                <span id="profile-initials">G</span>
            </button>
        </div>
    </header>

    <div id="profile-dropdown" role="menu">
        <div class="dropdown-header">
            <div class="dropdown-avatar" id="dropdown-avatar">G</div>
            <div>
                <div class="dropdown-name" id="dropdown-name">Garçom</div>
                <div class="dropdown-role" id="dropdown-role">garcom@rest.com</div>
            </div>
        </div>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item danger" onclick="logout()">
            <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sair
        </button>
    </div>

    <main id="content" aria-label="Lista de pratos"></main>

    <div class="fab-container">
        <button class="fab fab-cancel" onclick="handleCancel()">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            Cancelar
        </button>
        <button class="fab fab-confirm" onclick="openReviewModal()">
            <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
            Confirmar
            <span class="fab-badge" id="fab-badge">0</span>
        </button>
    </div>
</div>

<!-- REVIEW MODAL -->
<div id="modal-overlay" role="dialog" aria-modal="true">
    <div id="modal">
        <div class="modal-handle" aria-hidden="true"></div>
        <div class="modal-header">
            <div>
                <div class="modal-title">Revisar pedido</div>
                <div class="modal-subtitle" id="modal-subtitle">—</div>
            </div>
            <button class="modal-close" onclick="closeReviewModal()" aria-label="Fechar">
                <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
        </div>
        <div class="modal-body" id="modal-body"></div>
        <div class="modal-actions">
            <button class="modal-btn modal-btn-secondary" onclick="closeReviewModal()">Voltar</button>
            <button class="modal-btn modal-btn-primary" onclick="confirmOrder()">Confirmar pedido</button>
        </div>
    </div>
</div>

<!-- CANCEL MODAL -->
<div id="cancel-overlay" role="dialog" aria-modal="true">
    <div id="cancel-modal">
        <div class="cancel-icon">⚠️</div>
        <div class="cancel-title">Cancelar pedido?</div>
        <p class="cancel-desc">Há itens selecionados. Se cancelar, todas as seleções serão perdidas.</p>
        <div class="cancel-actions">
            <button class="modal-btn modal-btn-secondary" onclick="closeCancelModal()">Continuar</button>
            <button class="modal-btn modal-btn-primary" style="background:var(--danger)" onclick="doCancel()">Cancelar mesmo</button>
        </div>
    </div>
</div>

<div id="toast-container" aria-live="polite"></div>

<script src="../scripts/shared.js" defer></script>

<script>     
    // ── CARDÁPIO ──
    const MENU = [
        { id: 'entradas', label: 'Entradas', icon: '🥗', items: [
            { id: 1, name: 'Bruschetta ao tomate',  price: 22.90, description: 'Fatias de pão italiano grelhado com tomate fresco, manjericão e azeite extra virgem.' },
            { id: 2, name: 'Carpaccio de carne',    price: 38.50, description: 'Finas fatias de filé mignon com alcaparras, parmesão e molho mostarda-mel.' },
            { id: 3, name: 'Caldo verde',            price: 18.00, description: 'Sopa tradicional portuguesa com couve, linguiça calabresa e azeite.' },
        ]},
        { id: 'principais', label: 'Pratos Principais', icon: '🍽️', items: [
            { id: 4, name: 'Risoto de camarão',     price: 78.00, description: 'Arroz arbóreo cremoso com camarões frescos, limão-siciliano e raspas de limão.' },
            { id: 5, name: 'Frango grelhado',        price: 52.00, description: 'Peito de frango temperado com ervas finas, acompanha arroz e salada.' },
            { id: 6, name: 'Filé ao molho madeira',  price: 89.90, description: 'Filé mignon grelhado ao ponto, coberto com molho madeira e cogumelos frescos.' },
            { id: 7, name: 'Massa ao pesto',         price: 44.00, description: 'Tagliatelle ao molho pesto de manjericão com pinoli e parmesão ralado na hora.' },
            { id: 8, name: 'Salmão grelhado',        price: 82.00, description: 'Filé de salmão com crosta de ervas, acompanha purê de batata baroa e legumes.' },
        ]},
        { id: 'sobremesas', label: 'Sobremesas', icon: '🍮', items: [
            { id: 9,  name: 'Tiramisù',     price: 28.00, description: 'Clássico italiano com camadas de biscoito champanhe, mascarpone e cacau em pó.' },
            { id: 10, name: 'Petit gâteau', price: 32.00, description: 'Bolinho de chocolate com centro cremoso quente, servido com sorvete de baunilha.' },
            { id: 11, name: 'Panna cotta',  price: 24.00, description: 'Sobremesa italiana suave com calda de frutas vermelhas frescas.' },
        ]},
        { id: 'bebidas', label: 'Bebidas', icon: '🥤', items: [
            { id: 12, name: 'Água mineral',   price:  7.00, description: 'Água mineral sem gás ou com gás. 500ml.' },
            { id: 13, name: 'Suco natural',   price: 16.00, description: 'Sucos: laranja, limão, maracujá, abacaxi. Natural ou com gelo.' },
            { id: 14, name: 'Refrigerante',   price: 10.00, description: 'Coca-Cola, Guaraná, Sprite, Fanta Laranja. Lata 350ml.' },
            { id: 15, name: 'Limonada suíça', price: 19.00, description: 'Limonada com leite condensado e creme de leite. 500ml.' },
            { id: 16, name: 'Espresso',       price: 10.00, description: 'Café espresso curto ou longo, grão arábica torrado na casa.' },
        ]},
    ];

    const selection = {};
    const params = new URLSearchParams(window.location.search);
    const tableId = params.get('table') || '?';

    function renderMenu() {
        const content = document.getElementById('content');
        content.innerHTML = '';
        MENU.forEach(cat => {
            const section = document.createElement('section');
            section.className = 'category-section';
            section.innerHTML = `<div id="anchor-${cat.id}" style="height:1px;margin-top:-1px"></div><div class="category-header"><span class="category-icon">${cat.icon}</span><span class="category-title">${cat.label}</span></div>`;
            cat.items.forEach(dish => section.appendChild(buildDishCard(dish)));
            content.appendChild(section);
        });
    }

    function buildDishCard(dish) {
        const s = selection[dish.id] || { qty: 0, note: '' };
        const card = document.createElement('div');
        card.className = `dish-card${s.qty > 0 ? ' has-quantity' : ''}${s.note ? ' has-note' : ''}`;
        card.id = `dish-${dish.id}`;
        card.innerHTML = `
            <div class="dish-main">
                <div class="dish-info">
                    <div class="dish-name">${escHtml(dish.name)}</div>
                    <div class="dish-price">R$ ${dish.price.toFixed(2).replace('.',',')}</div>
                </div>
                <div class="note-badge" title="Tem anotação"></div>
                <button class="dish-expand-btn" onclick="togglePanel(${dish.id})" aria-label="Detalhes e anotação">
                    <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
                </button>
                <div class="dish-qty">
                    <button class="qty-btn" onclick="changeQty(${dish.id},1)">▲</button>
                    <input class="qty-value" type="number" min="0" max="99" value="${s.qty}" id="qty-${dish.id}" onchange="setQty(${dish.id},this.value)" onkeydown="if(event.key==='Enter')this.blur()">
                    <button class="qty-btn" onclick="changeQty(${dish.id},-1)">▼</button>
                </div>
            </div>
            <div class="dish-panel">
                <p class="dish-description">${dish.description}</p>
                <div class="note-label">Anotação</div>
                <textarea class="note-input" id="note-${dish.id}" placeholder="Ex: sem cebola, molho à parte..." oninput="saveNote(${dish.id},this.value)">${s.note}</textarea>
            </div>`;
        return card;
    }

    function renderSidebarCategories() {
        const container = document.getElementById('sidebar-categories');
        container.innerHTML = '';
        MENU.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'nav-item category';
            btn.setAttribute('data-tooltip', cat.label);
            btn.innerHTML = `<div class="cat-dot"></div><span class="nav-label">${cat.icon} ${cat.label}</span>`;
            btn.addEventListener('click', () => document.getElementById(`anchor-${cat.id}`)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
            container.appendChild(btn);
        });
    }

    function changeQty(id, delta) { setQty(id, (selection[id]?.qty || 0) + delta); }

    function setQty(id, raw) {
        const qty = Math.max(0, Math.min(99, parseInt(raw) || 0));
        if (!selection[id]) selection[id] = { qty: 0, note: '' };
        selection[id].qty = qty;
        const input = document.getElementById(`qty-${id}`);
        if (input) input.value = qty;
        document.getElementById(`dish-${id}`)?.classList.toggle('has-quantity', qty > 0);
        updateBadge();
    }

    function saveNote(id, value) {
        if (!selection[id]) selection[id] = { qty: 0, note: '' };
        selection[id].note = value.trim();
        document.getElementById(`dish-${id}`)?.classList.toggle('has-note', !!value.trim());
    }

    function togglePanel(id) {
        const card = document.getElementById(`dish-${id}`);
        card.classList.toggle('expanded');
        if (card.classList.contains('expanded')) setTimeout(() => document.getElementById(`note-${id}`)?.focus(), 150);
    }

    function updateBadge() {
        const total = Object.values(selection).reduce((s, v) => s + v.qty, 0);
        document.getElementById('fab-badge').textContent = total;
    }

    function getSelectedItems() {
        const out = [];
        MENU.forEach(cat => cat.items.forEach(dish => {
            const s = selection[dish.id];
            if (s?.qty > 0) out.push({ ...dish, qty: s.qty, note: s.note || '' });
        }));
        return out;
    }

    function fmtPrice(n) { return 'R$ ' + n.toFixed(2).replace('.', ','); }

    function openReviewModal() {
        const items = getSelectedItems();
        if (!items.length) { showToast('Nenhum item selecionado.'); return; }
        const total = items.reduce((s, i) => s + i.price * i.qty, 0);
        document.getElementById('modal-subtitle').textContent = `Mesa ${tableId} · ${items.length} item${items.length > 1 ? 's' : ''} · ${fmtPrice(total)}`;
        document.getElementById('modal-body').innerHTML = items.map(i => `
            <div class="review-item">
                <div class="review-item-left">
                    <div class="review-item-name">${escHtml(i.name)}</div>
                    ${i.note ? `<div class="review-item-note">📝 ${escHtml(i.note)}</div>` : ''}
                </div>
                <div class="review-item-right">
                    <div class="review-item-qty">×${i.qty}</div>
                    <div class="review-item-price">${fmtPrice(i.price * i.qty)}</div>
                </div>
            </div>`).join('') + `
            <div class="review-total">
                <span class="review-total-label">Total desta rodada</span>
                <span class="review-total-value">${fmtPrice(total)}</span>
            </div>`;
        document.getElementById('modal-overlay').classList.add('open');
        document.body.style.overflow = 'hidden';
    }

    function closeReviewModal() {
        document.getElementById('modal-overlay').classList.remove('open');
        document.body.style.overflow = '';
    }

    function confirmOrder() {
        const items = getSelectedItems();
        const total = items.reduce((s, i) => s + i.price * i.qty, 0);
        const key = `t4u-orders-table-${tableId}`;
        const history = JSON.parse(sessionStorage.getItem(key) || '[]');
        history.push({ timestamp: Date.now(), items, total });
        sessionStorage.setItem(key, JSON.stringify(history));
        closeReviewModal();
        showToast('✓ Pedido enviado para a cozinha!');
        setTimeout(() => { window.location.href = 'waiter.html'; }, 1200);
    }

    function handleCancel() {
        const hasItems = Object.values(selection).some(s => s.qty > 0);
        if (hasItems) document.getElementById('cancel-overlay').classList.add('open');
        else window.location.href = 'waiter.html';
    }

    function handleNavMesas(e) {
        const hasItems = Object.values(selection).some(s => s.qty > 0);
        if (hasItems) { e.preventDefault(); document.getElementById('cancel-overlay').classList.add('open'); }
    }

    function closeCancelModal() { document.getElementById('cancel-overlay').classList.remove('open'); }
    function doCancel() { window.location.href = 'waiter.html'; }

    document.getElementById('modal-overlay').addEventListener('click', function(e) { if (e.target === this) closeReviewModal(); });
    document.getElementById('cancel-overlay').addEventListener('click', function(e) { if (e.target === this) closeCancelModal(); });
    
    // Garantir que o DOM e o shared.js estejam prontos
    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const tableId = params.get('table') || '?';
        document.getElementById('topbar-title').textContent = `Pedido — Mesa ${tableId}`;

        renderMenu();
        renderSidebarCategories();
    });
</script>
</body>
</html>
