<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila - Table4U</title>
    <link rel="stylesheet" href="../styles/Global.css">
    <link rel="stylesheet" href="../styles/recepcao.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app">

        <aside class="sidebar">
            <button onclick="voltarMesas()">←</button>
        </aside>

        <main class="main">

            <header class="topbar">
                <h2>Table4U</h2>
                <div class="user">User 👤</div>
            </header>

            <h1 class="page-title">Fila</h1>

            <div class="divider"></div>

            <div class="fila-container">

                <div class="fila-lista">
                    <button class="fila-item ativo" data-nome="João" data-posição="1">João #1</button>
                    <button class="fila-item ativo" data-nome="Arthur" data-posição="2">Arthur #2</button>
                    <button class="fila-item ativo" data-nome="Pedro" data-posição="3"> Pedro #3</button>
                </div>

                <div class="fila-detalhe">
                    <h3 id="detalhe-nome">João #1</h3>
                    <p id="detalhe-tempo">Tempo restante: XX:XX</p>

                    <div class="acoes">
                        <button class="action-btn btn-primary">Check-in</button>
                        <button class="action-btn">Remover</button>
                    </div>
                </div>

            </div>

        </main>

    </div>
    <footer>
        <p class="footer-info">Endereço e Contatos</p>
        <p class="powerby">Powered by Table4U</p>
    </footer>

    <script src="../scripts/recepcao.js"></script>
</body>
</html>
